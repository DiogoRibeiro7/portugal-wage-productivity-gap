[tool.poetry]
name = "portugal-wage-productivity-gap"
version = "0.3.0"
description = "Reproducible analysis of Portugal's wage gap relative to its productivity gap"
authors = ["Diogo Ribeiro"]
readme = "README.md"
packages = [{ include = "pt_wage_gap", from = "src" }]
license = "MIT"

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
DataExcept = ">=1.7,<2"
numpy = ">=2.0,<2.3"
pandas = "^2.2"
requests = "^2.32"
PyYAML = "^6.0"
statsmodels = "^0.14"
matplotlib = "^3.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^6.0"
ruff = "^0.9"
mypy = "^1.14"
pandas-stubs = "^2.2"
types-PyYAML = "^6.0"
types-requests = "^2.32"

[tool.poetry.scripts]
pt-wage-gap = "pt_wage_gap.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

# These legacy diagnostics are confined to files listed in the archived design lock.
[tool.ruff.lint.per-file-ignores]
"src/pt_wage_gap/cli.py" = ["UP035"]
"src/pt_wage_gap/config.py" = ["UP035"]
"src/pt_wage_gap/econometrics.py" = ["UP035"]
"src/pt_wage_gap/eurostat.py" = ["UP035"]
"src/pt_wage_gap/pipeline.py" = ["F401"]
"src/pt_wage_gap/release.py" = ["F401", "F841", "UP035"]
"src/pt_wage_gap/snapshots.py" = ["UP035"]
"src/pt_wage_gap/source_contract.py" = ["I001"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["statsmodels.*"]
ignore_missing_imports = true

# Keep the archived design sources intact while constraining existing typing diagnostics.
[[tool.mypy.overrides]]
module = ["pt_wage_gap.metrics"]
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = ["pt_wage_gap.econometrics"]
disable_error_code = ["no-any-return"]

[[tool.mypy.overrides]]
module = ["pt_wage_gap.bulk"]
disable_error_code = ["call-overload"]

[[tool.mypy.overrides]]
module = ["pt_wage_gap.release"]
disable_error_code = ["arg-type", "redundant-cast"]

[[tool.mypy.overrides]]
module = ["test_metrics"]
disable_error_code = ["operator"]

[[tool.mypy.overrides]]
module = ["test_econometrics"]
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = ["test_release", "test_pipeline_integration"]
disable_error_code = ["redundant-cast"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
